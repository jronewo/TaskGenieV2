name: Deploy to Cloud Run

# Only the production branch deploys, and only by hand or on a push that already passed CI.
on:
  push:
    branches: [production]
  workflow_dispatch:

# Two deploys at once would race each other onto the same service. Queue instead of cancelling:
# a half-finished deploy is worse than a slightly stale one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGION: asia-southeast1
  REPOSITORY: taskgenie
  API_SERVICE: taskgenie-api
  WEB_SERVICE: taskgenie-web

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    # Needs the same green light as everything else — a failing test must not reach production.
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker $REGION-docker.pkg.dev --quiet

      # ── API ──────────────────────────────────────────────────────────────────────────────
      - name: Build & push API image
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$API_SERVICE:${{ github.sha }}"
          docker build -f src/TaskGenie.API/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "API_IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Deploy API
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          INSTANCE=$(gcloud sql instances describe taskgenie-db --format='value(connectionName)')

          # Secrets are mounted from Secret Manager rather than passed as plain env vars, so their
          # values never appear in the service description, the deploy log, or `gcloud describe`.
          #
          # VertexAi__ProjectId is not one of them: it is the project this service already runs in,
          # and the credential is the service account, not a key. Leaving it unset makes the
          # assistant fall back to pattern matching rather than fail to start.
          #
          # Keep comments out of the command below — a '#' line between two backslash-continued
          # lines ends the command, and the next flag is then run as its own program.
          gcloud run deploy "$API_SERVICE" \
            --image="$API_IMAGE" \
            --region="$REGION" \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --memory=1Gi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=4 \
            --add-cloudsql-instances="$INSTANCE" \
            --set-env-vars="ASPNETCORE_ENVIRONMENT=Production,Payments__UseFakeProvider=false,VertexAi__ProjectId=$PROJECT_ID" \
            --set-secrets="ConnectionStrings__DefaultConnection=db-connection:latest,Jwt__Secret=jwt-secret:latest,PayOS__ClientId=payos-client-id:latest,PayOS__ApiKey=payos-api-key:latest,PayOS__ChecksumKey=payos-checksum-key:latest,HuggingFace__ApiKey=huggingface-key:latest,Smtp__Host=smtp-host:latest,Smtp__FromAddress=smtp-from-address:latest,Smtp__UserName=smtp-username:latest,Smtp__Password=smtp-password:latest,GoogleAuth__ClientId=google-client-id:latest,GoogleAuth__ClientIds=google-client-ids:latest" \
            --quiet

      - name: Read the API URL
        run: |
          API_URL=$(gcloud run services describe "$API_SERVICE" --region="$REGION" --format='value(status.url)')
          echo "API_URL=$API_URL" >> $GITHUB_ENV
          echo "API deployed at $API_URL"

      # ── Web ──────────────────────────────────────────────────────────────────────────────
      # Built after the API on purpose: Vite inlines the API URL at build time, so the image
      # cannot be produced until the URL is known. Configuring it at runtime is not an option for
      # a static bundle.
      - name: Build & push web image
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$WEB_SERVICE:${{ github.sha }}"

          # The Google client id has to be baked in too: Vite inlines it, and the sign-in button
          # renders only when it is present. Read from Secret Manager rather than a GitHub secret
          # so there is one source of truth shared with the API, which validates tokens against
          # the same id.
          GOOGLE_CLIENT_ID=$(gcloud secrets versions access latest --secret=google-client-id 2>/dev/null || echo "")

          docker build -f FE-WEB-V2/Dockerfile \
            --build-arg VITE_API_BASE_URL="$API_URL/api" \
            --build-arg VITE_GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" \
            -t "$IMAGE" FE-WEB-V2
          docker push "$IMAGE"
          echo "WEB_IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Deploy web
        run: |
          gcloud run deploy "$WEB_SERVICE" \
            --image="$WEB_IMAGE" \
            --region="$REGION" \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --memory=256Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=4 \
            --quiet

      # The API builds the PayOS return/cancel links and the expiry-email links from App:BaseUrl,
      # which defaults to localhost:5173. Left unset, a buyer who finishes paying is sent back to
      # their own machine. The web URL only exists after the web service is deployed, so the API
      # is updated with it here rather than during its own deploy.
      - name: Point the API at the web URL
        run: |
          WEB_URL=$(gcloud run services describe "$WEB_SERVICE" --region="$REGION" --format='value(status.url)')
          gcloud run services update "$API_SERVICE" \
            --region="$REGION" \
            --update-env-vars="App__BaseUrl=$WEB_URL" \
            --quiet

      - name: Summary
        run: |
          WEB_URL=$(gcloud run services describe "$WEB_SERVICE" --region="$REGION" --format='value(status.url)')
          {
            echo "### Đã deploy"
            echo ""
            echo "| Service | URL |"
            echo "|---|---|"
            echo "| Web | $WEB_URL |"
            echo "| API | $API_URL |"
            echo ""
            echo "Webhook PayOS: \`$API_URL/api/webhooks/payos\`"
          } >> $GITHUB_STEP_SUMMARY
