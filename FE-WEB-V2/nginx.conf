# Rendered by nginx's entrypoint with $PORT substituted from the Cloud Run environment.
server {
    listen       ${PORT};
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Never cache the entry document: it names the hashed asset bundles, so a stale copy points
    # the browser at files that no longer exist after a deploy.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Everything under /assets carries a content hash in its name, so it can be cached forever —
    # a new build produces new names rather than new contents at the same name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Single-page app: unknown paths are client routes, not missing files, so they get index.html
    # instead of a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip              on;
    gzip_types        text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;

    # The app is only ever framed by itself; blocking the rest removes clickjacking as a concern.
    add_header X-Frame-Options        "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
}
